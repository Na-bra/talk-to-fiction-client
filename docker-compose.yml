# Builds and serves the client:
#
#   docker compose up --build        ->  http://localhost:8080
#
# The build arguments are read from .env — the same file `npm run dev` uses.
# VITE_API_URL is called by the *browser*, so it must be an address the
# browser can reach (http://localhost:4000, or the deployed API), not a
# container name.

services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set VITE_SUPABASE_URL in .env}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?set VITE_SUPABASE_PUBLISHABLE_KEY in .env}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "8080:80"
