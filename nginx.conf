server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Build output is content-hashed: a changed file gets a new name, so each
  # name can be cached for a year. A missing asset is a real 404, never the
  # app shell.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Every other path is a client-side route (/login, /npc/:id, ...): serve the
  # app shell and let React Router pick the page — the same job vercel.json
  # does on Vercel. index.html is never cached, so a new image is picked up on
  # the next page load.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
